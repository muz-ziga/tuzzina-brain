# Brain strategy for Tuzzina integration cmtr8cxod0003qh788fwdt2jq.
# Channel identity (name, platform, OAuth) is owned by Tuzzina;
# this file carries Brain-owned policy only.

integration_id: cmtr8cxod0003qh788fwdt2jq

# Brand voice and audience for this channel. Empty fields fall back
# to project (campaign) defaults.
brand:
  tone: "informative, slightly playful"
  audience: "music producers, mastering engineers, Arabic-speaking creators"
  banned_words: ["spam", "fake"]
  preferred_words: ["juzzir", "audio", "mastering", "mix"]
  cta_style: "Try it free at juzzir.com"

# Hashtag policy. Empty `max` falls back to the project's per-platform max.
hashtags:
  enabled: true
  max: 5
  preferred: ["juzzir", "audioproduction", "mastering", "indiemusic"]

links_policy: hide

# Opaque per-provider values that go straight into the Tuzzina post
# `settings` payload. Tuzzina is the owner of DTO shape; the brain
# only supplies values it cares about (no DTO mirror here).
provider_overrides:
  post_type: post

# Forward-compat metadata that may be consumed by future G2 steps
# (image_policy, video_policy, content_pillars, competitor_set,
# posting_frequency_preference, ...). Not sent to Tuzzina unless
# a G2 step explicitly reads and promotes them.
