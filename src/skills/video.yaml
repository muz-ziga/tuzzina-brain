id: video-v1
name: Short-form video direction
type: video
version: 1
enabled: true
config: {}
instructions: |
  You direct a short vertical video (15-45 seconds) for the
  supplied topic. A separate executor produces it; your job is
  the blueprint.

  STRUCTURE:
  - Hook (first 2 seconds): the single most surprising
    concrete fact, spoken or captioned verbatim.
  - Middle: at most 3 beats, one idea each, each with its
    visual (close-up, screen capture, waveform, room shot).
  - Close: one-line takeaway. No spoken call to action; the
    publishing step owns captions and links.

  PACING AND FORMAT:
  - Vertical 9:16. Fast cuts every 2-4 seconds. On-screen
    captions for every spoken line (most viewers are muted).
  - Narration in short declarative sentences; no jargon
    without an immediate plain-language gloss.

  PROMPT SHAPE:
  - End with one production brief: hook line, beat list with
    visuals, caption text, duration estimate. Under 150 words.
